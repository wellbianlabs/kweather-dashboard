<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 196" role="img" aria-label="케이웨더 체감온도계 STS 장비">
  <defs>
    <filter id="stsShadow" x="-25%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.20"/>
    </filter>
    <linearGradient id="stsBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef1f5"/>
    </linearGradient>
    <linearGradient id="stsLcd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d2d7cb"/>
      <stop offset="1" stop-color="#bbc1b2"/>
    </linearGradient>
  </defs>

  <!-- 본체 -->
  <rect x="14" y="8" width="212" height="166" rx="16" fill="url(#stsBody)" stroke="#d3dae3" stroke-width="1.5" filter="url(#stsShadow)"/>

  <!-- LCD 패널 -->
  <rect x="30" y="22" width="180" height="124" rx="7" fill="url(#stsLcd)" stroke="#959d8b" stroke-width="1.2"/>

  <!-- 구획선 -->
  <g stroke="#7c8472" stroke-width="1" opacity="0.85">
    <line x1="124" y1="22" x2="124" y2="146"/>
    <line x1="124" y1="70" x2="210" y2="70"/>
    <line x1="124" y1="110" x2="210" y2="110"/>
  </g>

  <!-- 좌측: 체감온도 -->
  <text x="42" y="42" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="12" font-weight="700" fill="#1f2937">체감온도</text>
  <text x="39" y="110" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="34" font-weight="700" fill="#111827" letter-spacing="-1.5">31.6<tspan font-size="15" dy="-1">℃</tspan></text>

  <!-- 우상단: 시계 -->
  <text x="131" y="40" font-family="'Malgun Gothic',sans-serif" font-size="8" font-weight="700" fill="#374151">▸ PM</text>
  <text x="167" y="60" text-anchor="middle" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="23" font-weight="700" fill="#111827">10:10</text>

  <!-- 우중단: 온도 -->
  <text x="131" y="88" font-family="'Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#374151">온도</text>
  <text x="205" y="104" text-anchor="end" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="18" font-weight="700" fill="#111827">30.9<tspan font-size="10">℃</tspan></text>

  <!-- 우하단: 습도 -->
  <text x="131" y="128" font-family="'Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#374151">습도</text>
  <text x="205" y="142" text-anchor="end" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="18" font-weight="700" fill="#111827">66.9<tspan font-size="10">%</tspan></text>

  <!-- 하단 버튼 -->
  <circle cx="120" cy="160" r="9" fill="#f1f3f5" stroke="#cbd2da" stroke-width="1.4"/>
</svg>
